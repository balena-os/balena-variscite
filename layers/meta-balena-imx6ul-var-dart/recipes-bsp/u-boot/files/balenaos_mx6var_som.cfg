# var-som-mx6 always loads the kernel and rootfs from MMC, even on the
# "nand" defconfig (only U-Boot itself lives in NAND). Set as a Kconfig
# fragment instead of patching include/configs/mx6var_som.h, so it survives
# upstream header changes.
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="setenv resin_kernel_load_addr ${loadaddr}; run resin_set_kernel_root; run set_os_cmdline; setenv mmcdev ${resin_dev_index}; setenv mmcbootpart ${resin_boot_part}; mmc dev ${mmcdev}; if mmc rescan; then if run loadbootenv; then run importbootenv; fi; if run loadbootscript; then run bootscript; else if run loadimage; then run mmcboot; else run netboot; fi; fi; else run netboot; fi;"
CONFIG_PARTITION_UUIDS=y
